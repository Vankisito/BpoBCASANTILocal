services:
  odoo:
    build: .
    container_name: odoo_clone
    depends_on:
      - db
    ports:
      - "8070:8069"
    volumes:
      - ./Custom_addons/GpoBCA_Seguros-desarrollo/BCA_Seguros:/mnt/extra-addons/BCA_Seguros
      - ./Custom_addons/GpoBCA_Seguros-desarrollo/BCA_seguros_ocr:/mnt/extra-addons/BCA_seguros_ocr
      - odoo_data_clone:/var/lib/odoo
    command: odoo --addons-path=/mnt/extra-addons -d bca_clean
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
  db:
    image: postgres:17
    container_name: odoo_db_clone
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - db_data_clone:/var/lib/postgresql/data
volumes:
  odoo_data_clone:
  db_data_clone:
