name: Deploy to Producción

on:
  push:
    branches: [produccion]

jobs:
  validar-ventana:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar ventana de despliegue
        run: |
          DIA=$(date +%A)
          HORA=$(date +%H)
          echo "Desplegando en: $DIA $HORA:00"
          # La validación real se configura por cliente en su manifest.yml

  identificar-clientes:
    needs: validar-ventana
    runs-on: ubuntu-latest
    outputs:
      clientes: ${{ steps.scan.outputs.clientes }}
    steps:
      - name: Obtener lista de clientes que usan este módulo
        id: scan
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          MODULE_NAME="${{ github.event.repository.name }}"
          CLIENTES=$(gh api /orgs/HabitatDigitalCo/repos --paginate --jq '.[].name' | grep "habitat-deploy-")
          MATCHING=()
          for repo in $CLIENTES; do
            MANIFEST=$(gh api repos/HabitatDigitalCo/$repo/contents/manifest.yml --jq '.content' | base64 -d)
            if echo "$MANIFEST" | grep -q "$MODULE_NAME"; then
              CLIENTE=$(echo "$repo" | sed 's/habitat-deploy-//')
              MATCHING+=("$CLIENTE")
            fi
          done

          echo "clientes=$(echo ${MATCHING[@]} | jq -R -s -c 'split(" ")')" >> $GITHUB_OUTPUT

  desplegar:
    needs: identificar-clientes
    environment: produccion
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cliente: ${{ fromJson(needs.identificar-clientes.outputs.clientes) }}
      max-parallel: 1
      fail-fast: true
    steps:
      - name: Leer manifiesto del cliente
        id: manifest
        run: |
          curl -H "Authorization: token ${{ secrets.ORG_READ_TOKEN }}" \
            https://raw.githubusercontent.com/HabitatDigitalCo/habitat-deploy-${{ matrix.cliente }}/main/manifest.yml \
            -o manifest.yml
          IP=$(yq '.droplets.produccion.ip' manifest.yml)
          DB=$(yq '.droplets.produccion.db_name' manifest.yml)
          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "db=$DB" >> $GITHUB_OUTPUT

      - name: Backup obligatorio pre-deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.manifest.outputs.ip }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            /opt/scripts/backup.sh ${{ steps.manifest.outputs.db }}

      - name: Deploy del módulo
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.manifest.outputs.ip }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/odoo/addons-custom/${{ github.event.repository.name }}
            git fetch origin produccion
            git reset --hard origin/produccion
            docker exec odoo-produccion odoo \
              -d ${{ steps.manifest.outputs.db }} \
              -u ${{ github.event.repository.name }} \
              --stop-after-init

      - name: Verificación post-deploy
        run: |
          sleep 30
          curl -f https://${{ matrix.cliente }}.habitatdigital.mx/web/health || exit 1

      - name: Notificar al equipo
        if: success()
        run: |
          curl -X POST ${{ secrets.WEBHOOK_NOTIFICACIONES }} \
            -d "🟢 ${{ github.event.repository.name }} en Producción para ${{ matrix.cliente }}"